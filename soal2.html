<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Sewa Kendaraan</title>
</head>
<body>
    <h2>Rekap Sewa Kendaraan</h2>

    <div>
        <label for="kendaraan">Nama Kendaraan:</label><br>
        <input type="text" id="kendaraan" placeholder="Contoh: Avanza"><br><br>

        <label for="lamaSewa">Lama Sewa (hari):</label><br>
        <input type="number" id="lamaSewa" placeholder="Contoh: 2"><br><br>

        <label for="tarifHari">Tarif per Hari (Rp):</label><br>
        <input type="number" id="tarifHari" placeholder="Contoh: 350000"><br><br>

        <button id="btnSimpan">Simpan</button>
    </div>

    <p id="hasil"></p>

    
    <script src="soal2.js"></script>
</body>
</html>
